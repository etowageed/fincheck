<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://pletefinance.com/" />
    <title>Plete Finance — AI-Powered Expense Tracker, Receipt OCR &amp; Financial Coach</title>

    <meta
      name="description"
      content="Track spending, log expenses in plain English, scan receipts with AI, simulate savings scenarios, and master your budget in one visual dashboard. Free to start."
    />
    <meta name="keywords" content="AI personal finance tracker, AI budget app, receipt OCR scanner, natural language expense tracker, AI financial coach, savings simulator, spending insights" />
    <meta name="author" content="Plete Finance Inc." />
    <meta name="theme-color" content="#0F172A" />
    <meta name="robots" content="index, follow" />

    <!-- Preconnect to Google Fonts for faster loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pletefinance.com/" />
    <meta property="og:site_name" content="Plete Finance" />
    <meta property="og:title" content="Plete Finance — AI-Powered Expense Tracker, Receipt OCR &amp; Financial Coach" />
    <meta
      property="og:description"
      content="Log expenses in plain English, scan receipts in seconds, simulate savings scenarios, and get personalized AI financial coaching. Free to start."
    />
    <meta property="og:image" content="https://pletefinance.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Plete Finance — AI-powered personal finance intelligence dashboard" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://pletefinance.com/" />
    <meta name="twitter:title" content="Plete Finance — AI-Powered Expense Tracker, Receipt OCR &amp; Financial Coach" />
    <meta
      name="twitter:description"
      content="Log expenses in plain English, scan receipts in seconds, simulate savings scenarios, and get personalized AI financial coaching. Free to start."
    />
    <meta name="twitter:image" content="https://pletefinance.com/og-image.png" />
    <meta name="twitter:image:alt" content="Plete Finance — AI-powered personal finance intelligence dashboard" />

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Plete Finance",
      "url": "https://pletefinance.com",
      "logo": "https://pletefinance.com/favicon.svg",
      "description": "Plete Finance combines visual budget and goal tracking with ground-truth AI financial intelligence.",
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "support@pletefinance.com",
        "contactType": "Customer Support"
      }
    }
    </script>

    <!-- Structured Data: WebApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Plete Finance",
      "url": "https://pletefinance.com",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Web",
      "description": "AI-powered personal finance tracker with natural-language Magic Quick-Log, Receipt OCR, predictive budget forecasts, what-if savings simulations, and personalized coaching.",
      "offers": [
        {
          "@type": "Offer",
          "name": "The Starter",
          "price": "0",
          "priceCurrency": "USD",
          "description": "Unlimited manual transactions, basic budgeting, 15 AI Quick-Logs/mo, 3 Receipt Scans/mo, Ask Plete AI, and current month dashboard."
        },
        {
          "@type": "Offer",
          "name": "The Pro",
          "price": "3.99",
          "priceCurrency": "USD",
          "priceSpecification": {
            "@type": "UnitPriceSpecification",
            "billingDuration": "P1M"
          },
          "description": "Unlimited AI Quick-Logs, unlimited Receipt & Note OCR, unlimited AI Financial Coach & Forecasts, 10+ years history, and PDF & Excel exports."
        }
      ],
      "creator": {
        "@type": "Organization",
        "name": "Plete Finance Inc."
      }
    }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
